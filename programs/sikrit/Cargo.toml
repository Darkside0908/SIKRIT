[package]
name = "sikrit"
version = "0.1.0"
description = "SIKRIT — Privacy-Preserving Dead Man's Switch on Solana"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]
name = "sikrit"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "0.30.1"
curve25519-dalek = { version = "4.1.3", default-features = false, features = ["alloc"] }
sha2 = "0.10.8"
